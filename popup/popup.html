<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobFill AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div class="brand-text">
          <span class="brand-title">JobFill AI</span>
          <span class="brand-badge" id="aiStatusBadge">IA Lista</span>
        </div>
      </div>
      <button id="btnOpenOptions" class="icon-btn" title="Configurar Perfil y API">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <div class="action-card">
      <button id="btnAutofill" class="btn-primary-action">
        <span class="btn-icon">⚡</span>
        <div class="btn-text-group">
          <span class="btn-main-text">Auto-Rellenar Formulario</span>
          <span class="btn-sub-text">1-Clic en la página actual</span>
        </div>
      </button>
      <div id="statusMessage" class="status-msg"></div>
    </div>

    <div class="profile-preview">
      <div class="preview-avatar" id="userInitial">U</div>
      <div class="preview-info">
        <div class="preview-name" id="userNameDisplay">Cargando perfil...</div>
        <div class="preview-role" id="userRoleDisplay">Sin configurar</div>
      </div>
    </div>

    <div class="popup-cv-profile-selector" id="popupProfileSection" style="margin-top: 10px;">
      <div style="font-size: 11px; font-weight: 600; color: #94a3b8; margin-bottom: 4px; display: flex; align-items: center; gap: 4px;">
        <span>🎯 Versión de CV Activa:</span>
      </div>
      <select id="popupCvProfileSelect" style="width: 100%; padding: 6px 10px; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 6px; color: #f8fafc; font-size: 12px; font-weight: 600; outline: none; cursor: pointer;">
        <!-- Dynamically rendered -->
      </select>
    </div>

    <div class="quick-copy-section">
      <div class="section-label">📋 Copiado Rápido de Datos:</div>
      <div class="chip-grid">
        <button class="chip" data-field="rut" id="chipRut" title="Copiar RUT / DNI">
          <span class="chip-icon">🪪</span> RUT / DNI
        </button>
        <button class="chip" data-field="email" id="chipEmail" title="Copiar Email">
          <span class="chip-icon">✉️</span> Email
        </button>
        <button class="chip" data-field="phone" id="chipPhone" title="Copiar Teléfono">
          <span class="chip-icon">📱</span> Teléfono
        </button>
        <button class="chip" data-field="linkedinUrl" id="chipLinkedin" title="Copiar LinkedIn">
          <span class="chip-icon">🔗</span> LinkedIn
        </button>
        <button class="chip" data-field="githubUrl" id="chipGithub" title="Copiar GitHub">
          <span class="chip-icon">💻</span> GitHub
        </button>
        <button class="chip" data-field="portfolioUrl" id="chipPortfolio" title="Copiar Portafolio">
          <span class="chip-icon">🌐</span> Portafolio
        </button>
        <button class="chip" data-field="summary" id="chipSummary" title="Copiar Resumen CV">
          <span class="chip-icon">📝</span> Resumen
        </button>
      </div>
    </div>

    <footer class="footer">
      <a href="#" id="linkEditData" class="footer-link">Editar Datos Completos &rarr;</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
